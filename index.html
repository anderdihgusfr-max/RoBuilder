<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini AI</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'VT323', monospace; }
    
    body {
      background: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #000000;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
    }

    select {
      background: transparent;
      color: #ffffff;
      border: none;
      font-size: 22px;
      outline: none;
      cursor: pointer;
      appearance: none;
      text-align: center;
    }

    .header-right { display: flex; gap: 15px; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      word-wrap: break-word;
      display: flex;
      flex-direction: column;
      gap: 8px;
      line-height: 1.2;
    }
    
    .user { 
      background: #1c1c1e; 
      align-self: flex-end; 
      padding: 15px; 
      border-radius: 20px; 
    }
    
    .ai { 
      align-self: flex-start; 
      background: transparent; 
      color: #e5e5e5;
    }
    
    .chat-img {
      max-width: 220px;
      max-height: 220px;
      border-radius: 12px;
      cursor: pointer;
      object-fit: cover;
    }

    #input-area {
      padding: 10px 15px 20px 15px;
      background: #000000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-pill {
      background: #1c1c1e;
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 20px;
      outline: none;
    }
    input[type="text"]::placeholder { color: #888; }

    .action-btn {
      background: transparent;
      color: #888;
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #credit-bar {
      font-size: 16px;
      color: #666;
      display: flex;
      justify-content: center;
      text-align: center;
    }

    #image-preview-container {
      display: none;
      align-items: center;
      gap: 10px;
      background: #1c1c1e;
      padding: 5px 10px;
      border-radius: 15px;
      width: fit-content;
    }
    #image-preview-container img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 8px;
    }
    .remove-img {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      cursor: pointer;
    }

    #image-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      justify-content: center;
      align-items: center;
      z-index: 4000;
      cursor: pointer;
    }
    #image-modal img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Fullscreen view">
  </div>

  <header>
    <button class="icon-btn">＝</button>
    <select id="model-select">
      <option value="gemini-3.1-flash-lite" style="color: #22c55e;">🟢 gemini-3.1-flash-lite ($)</option>
      <option value="gemini-2.5-flash" style="color: #f97316;">🟠 gemini-2.5-flash ($$)</option>
      <option value="gemini-3.5-flash" style="color: #eab308;">🟡 gemini-3.5-flash ($$$)</option>
      <option value="gemini-2.5-pro" style="color: #ef4444;">🟤 gemini-2.5-pro ($$$$)</option>
      <option value="gemini-3.1-pro-preview" style="color: #dc2626;">🔴 gemini-3.1-pro-preview ($$$$$)</option>
    </select>
    <div class="header-right">
      <button class="icon-btn">↻</button>
      <button class="icon-btn">⋮</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="message ai">Gemini +<br><br>hey bro! How can I help you today?</div>
  </div>

  <div id="input-area">
    <div id="image-preview-container">
      <img id="preview-thumb" src="" alt="preview">
      <button class="remove-img" onclick="clearImage()">✕</button>
    </div>
    
    <div class="input-pill">
      <label class="action-btn">
        ＋ <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
      </label>
      <input type="text" id="prompt-input" placeholder="Ask Gemini" autocomplete="off">
      <button class="action-btn" onclick="sendMessage()" style="border: 1px solid #444; border-radius: 8px; width: 32px; height: 32px; font-size: 16px;">⏏</button>
    </div>
    
    <div id="credit-bar">
      Credits: <strong id="credit-count" style="color:#4ade80; margin-left: 5px;">1000</strong> 🪙
    </div>
  </div>

  <script>
    let userCredits = 1000;
    let chatHistory = [];
    let currentBase64Image = null;
    let currentMimeType = null;

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      currentMimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Full = e.target.result;
        currentBase64Image = base64Full.split(',')[1];
        document.getElementById('preview-thumb').src = base64Full;
        document.getElementById('image-preview-container').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      currentBase64Image = null;
      currentMimeType = null;
      document.getElementById('image-input').value = '';
      document.getElementById('image-preview-container').style.display = 'none';
    }

    function openModal(imgSrc) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('image-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('image-modal').style.display = 'none';
    }

    async function sendMessage() {
      const input = document.getElementById('prompt-input');
      const container = document.getElementById('chat-container');
      const creditDisplay = document.getElementById('credit-count');
      const modelSelect = document.getElementById('model-select');
      
      const text = input.value.trim();
      if (!text && !currentBase64Image) return;

      if (userCredits <= 0) {
        alert("Out of credits! You broke, bradar 💀");
        return;
      }

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      
      let userContentHtml = '';
      if (currentBase64Image) {
        const fullDataUrl = `data:${currentMimeType};base64,${currentBase64Image}`;
        userContentHtml += `<img src="${fullDataUrl}" class="chat-img" onclick="openModal('${fullDataUrl}')">`;
      }
      if (text) {
        userContentHtml += `<span>${text}</span>`;
      }
      userMsg.innerHTML = userContentHtml;
      container.appendChild(userMsg);

      const attachedImgBase64 = currentBase64Image;
      const attachedMime = currentMimeType;

      input.value = '';
      clearImage();
      container.scrollTop = container.scrollHeight;

      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.innerHTML = 'Thinking...';
      container.appendChild(aiMsg);
      container.scrollTop = container.scrollHeight;

      try {
        const userParts = [];
        if (attachedImgBase64) {
          userParts.push({ inline_data: { mime_type: attachedMime, data: attachedImgBase64 } });
        }
        if (text) {
          userParts.push({ text: text });
        }

        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text || "Analyze this image.",
            model: modelSelect.value,
            history: chatHistory,
            imagePart: attachedImgBase64 ? { mime_type: attachedMime, data: attachedImgBase64 } : null
          })
        });

        const data = await res.json();
        let reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error processing response.";
        
        reply = reply.replace(/\n/g, '<br>');
        aiMsg.innerHTML = reply;
        
        const cost = Math.max(5, Math.floor(reply.length / 10));
        userCredits = Math.max(0, userCredits - cost);
        creditDisplay.innerText = userCredits;

        chatHistory.push({ role: 'user', parts: userParts });
        chatHistory.push({ role: 'model', parts: [{ text: reply.replace(/<br>/g, '\n') }] });

      } catch (err) {
        aiMsg.innerHTML = 'Request failed (SERVER_ERROR). Check backend route!';
      }

      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('prompt-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
