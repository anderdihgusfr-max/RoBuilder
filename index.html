<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: radial-gradient(circle at top left, #051923, #020617 80%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    .app-header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      color: #67e8f9;
      text-shadow: 0 0 10px rgba(103, 232, 249, 0.5);
    }

    .brand-logo img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .pill-btn {
      background: rgba(8, 51, 68, 0.5);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #a5f3fc;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .pill-btn:hover { background: rgba(6, 182, 212, 0.25); border-color: #22d3ee; }

    .mode-select {
      background: rgba(8, 51, 68, 0.6);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #22d3ee;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    /* Live Debug Console Log Drawer */
    .console-drawer {
      display: none;
      width: 100%;
      max-width: 680px;
      height: 140px;
      background: rgba(2, 6, 23, 0.95);
      border: 1px solid #22d3ee;
      border-radius: 12px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: #22c55e;
      overflow-y: auto;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
    }
    .console-drawer.active { display: block; }
    .log-err { color: #f43f5e; }
    .log-info { color: #38bdf8; }

    /* Chat Messages Box */
    .chat-container {
      width: 100%;
      max-width: 680px;
      flex: 1;
      min-height: 50vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 12px;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .msg-row { display: flex; gap: 10px; margin-bottom: 8px; width: 100%; }
    .msg-row.user { justify-content: flex-end; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar.ai img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar.user { background: #1e293b; border: 1px solid #475569; }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg-row.ai .bubble {
      background: rgba(8, 51, 68, 0.5);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: #ecfeff;
      border-top-left-radius: 4px;
    }
    .msg-row.user .bubble {
      background: #06b6d4;
      color: #020617;
      font-weight: 500;
      border-top-right-radius: 4px;
    }

    /* Loading Spinner Animation */
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #22d3ee;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Input & Control Box */
    .input-card {
      width: 100%;
      max-width: 680px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .image-preview-wrapper { display: flex; gap: 8px; flex-wrap: wrap; }
    .image-preview-item {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #22d3ee;
    }
    .image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .remove-img-btn {
      position: absolute; top: 2px; right: 2px;
      background: rgba(2, 6, 23, 0.85); color: #67e8f9;
      border: none; border-radius: 50%; width: 14px; height: 14px;
      font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .textarea-box {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      resize: none;
      outline: none;
      height: 48px;
    }
    .textarea-box::placeholder { color: #67e8f9; opacity: 0.5; }

    .bottom-bar { display: flex; justify-content: space-between; align-items: center; }
    .bar-left, .bar-right { display: flex; align-items: center; gap: 8px; }

    .send-btn {
      background: #06b6d4;
      border: none;
      color: #020617;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-weight: bold; font-size: 16px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
    }
    .send-btn:hover { background: #22d3ee; box-shadow: 0 0 15px rgba(34, 211, 238, 0.8); }

    /* Studio Config Drawer */
    .top-bar {
      display: none; width: 100%; max-width: 680px;
      background: rgba(15, 23, 42, 0.9); border: 1px solid #06b6d4;
      padding: 10px; border-radius: 12px; margin-bottom: 10px;
    }
    .top-bar.active { display: flex; flex-direction: column; gap: 6px; }
    .top-bar input { background: #083344; border: 1px solid #06b6d4; color: #fff; padding: 6px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="app-header">
    <div class="brand-logo">
      <img src="https://raw.githubusercontent.com/anderdihgusfr-max/RoBuilder/refs/heads/main/Untitled78_20260730234253.png" alt="Logo">
      <span>Gemini AI</span>
    </div>
    
    <div class="header-actions">
      <!-- Mode Switcher: AI Chat vs Roblox Studio -->
      <select id="appMode" class="mode-select" onchange="switchMode()">
        <option value="chat">🤖 AI Chat</option>
        <option value="studio">🧱 Roblox Studio</option>
      </select>

      <button class="pill-btn" onclick="toggleConsole()">📟 Log</button>
      <button class="pill-btn" onclick="redirectToPayment()">💎 <span id="creditDisplay">1.50</span></button>
    </div>
  </div>

  <!-- Studio Config Drawer -->
  <div class="top-bar" id="topConfigBar">
    <input type="password" id="githubToken" value="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" placeholder="GitHub Token">
    <input type="text" id="gistId" value="210edf12f31701ce97b141e248fa090c" placeholder="Gist ID">
  </div>

  <!-- Interactive On-Screen Console Log -->
  <div class="console-drawer" id="consoleLog">
    <div class="log-info">[System] Debug Console initialized...</div>
  </div>

  <!-- Chat History Window -->
  <div class="chat-container" id="chatWindow">
    <div class="msg-row ai">
      <div class="avatar ai">
        <img src="https://raw.githubusercontent.com/anderdihgusfr-max/RoBuilder/refs/heads/main/Untitled78_20260730234253.png" alt="AI">
      </div>
      <div class="bubble">Hey! I'm Gemini AI. How can I help you out today?</div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-card">
    <div class="image-preview-wrapper" id="imgPreviewWrapper"></div>

    <textarea id="promptInput" class="textarea-box" placeholder="Ask Gemini anything..."></textarea>

    <div class="bottom-bar">
      <div class="bar-left">
        <button class="pill-btn" onclick="document.getElementById('imageFileInput').click()">🖼️ (0/5)</button>
        <input type="file" id="imageFileInput" accept="image/*" multiple style="display: none;" onchange="handleImageUpload(event)">
      </div>

      <div class="bar-right">
        <select id="modelSelector" class="mode-select">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        </select>
        
        <button class="send-btn" onclick="sendPrompt()">➔</button>
      </div>
    </div>
  </div>

  <script>
    const LOGO_URL = "https://raw.githubusercontent.com/anderdihgusfr-max/RoBuilder/refs/heads/main/Untitled78_20260730234253.png";
    let availableCredits = 1.50;
    let uploadedImages = [];

    function logToConsole(msg, type = 'info') {
      const consoleBox = document.getElementById('consoleLog');
      const entry = document.createElement('div');
      entry.className = type === 'err' ? 'log-err' : 'log-info';
      entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      consoleBox.appendChild(entry);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function toggleConsole() {
      document.getElementById('consoleLog').classList.toggle('active');
    }

    function switchMode() {
      const mode = document.getElementById('appMode').value;
      const configBar = document.getElementById('topConfigBar');
      if (mode === 'studio') {
        configBar.classList.add('active');
        logToConsole("Switched mode to Roblox Studio", "info");
      } else {
        configBar.classList.remove('active');
        logToConsole("Switched mode to AI Chat", "info");
      }
    }

    function redirectToPayment() {
      alert("Redirecting to purchase 💎 credits with Robux / Cards...");
      logToConsole("Redirecting user to credit shop...");
    }

    function handleImageUpload(event) {
      const files = Array.from(event.target.files);
      if (uploadedImages.length + files.length > 5) {
        alert("Maximum 5 images allowed!");
        return;
      }

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const full = e.target.result;
          const raw = full.split(',')[1];
          uploadedImages.push({ full, raw });
          renderPreviews();
        };
        reader.readAsDataURL(file);
      });
      document.getElementById('imageFileInput').value = '';
    }

    function removeImage(idx) {
      uploadedImages.splice(idx, 1);
      renderPreviews();
    }

    function renderPreviews() {
      const wrapper = document.getElementById('imgPreviewWrapper');
      wrapper.innerHTML = '';
      uploadedImages.forEach((img, idx) => {
        wrapper.innerHTML += `
          <div class="image-preview-item">
            <img src="${img.full}">
            <button class="remove-img-btn" onclick="removeImage(${idx})">✕</button>
          </div>`;
      });
    }

    async function sendPrompt() {
      const promptInput = document.getElementById('promptInput');
      const promptText = promptInput.value.trim();
      const activeModel = document.getElementById('modelSelector').value;
      const mode = document.getElementById('appMode').value;
      const chatWindow = document.getElementById('chatWindow');

      if (!promptText && uploadedImages.length === 0) return;

      let estimatedCost = activeModel === 'gemini-1.5-pro' ? 0.50 : 0.10;

      if (availableCredits < estimatedCost) {
        alert("Not enough 💎 credits! Please add more credits.");
        return;
      }

      chatWindow.innerHTML += `
        <div class="msg-row user">
          <div class="bubble">${promptText || "[Attached Image]"}</div>
          <div class="avatar user">👤</div>
        </div>
      `;

      const aiMsgId = 'ai-msg-' + Date.now();
      chatWindow.innerHTML += `
        <div class="msg-row ai" id="${aiMsgId}">
          <div class="avatar ai">
            <img src="${LOGO_URL}" alt="AI">
          </div>
          <div class="bubble"><span class="loading-spinner"></span> Thinking...</div>
        </div>
      `;
      chatWindow.scrollTop = chatWindow.scrollHeight;

      promptInput.value = '';
      logToConsole(`Sending payload in ${mode === 'studio' ? 'Roblox Studio' : 'AI Chat'} mode (${activeModel})...`);

      try {
        const vercelEndpoint = 'https://YOUR-VERCEL-URL.vercel.app/api/generate';

        const res = await fetch(vercelEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: mode === 'studio' ? `[ROBLOX LUAU CODE REQUEST]: ${promptText}` : promptText,
            activeModel: activeModel,
            uploadedImages: uploadedImages.map(i => i.raw)
          })
        });

        if (res.status === 429) {
          throw new Error("RATE_LIMIT");
        }

        if (!res.ok) {
          throw new Error(`SERVER_ERROR_${res.status}`);
        }

        const data = await res.json();

        if (data.error) {
          if (data.error.includes("429") || data.error.toLowerCase().includes("quota")) {
            throw new Error("RATE_LIMIT");
          }
          throw new Error(data.error);
        }

        let reply = data.candidates[0].content.parts[0].text;

        if (mode === 'studio') {
          let luauCode = reply.replace(/```lua/g, '').replace(/```/g, '').trim();
          await sendToGist(luauCode);
          reply = "✅ **Roblox Studio Code Generated and Sent to Gist!**\n\n" + reply;
        }

        document.getElementById(aiMsgId).querySelector('.bubble').innerText = reply;

        availableCredits -= estimatedCost;
        document.getElementById('creditDisplay').innerText = availableCredits.toFixed(2);
        logToConsole(`Response received successfully. Deducted 💎 ${estimatedCost.toFixed(2)}. Remaining: 💎 ${availableCredits.toFixed(2)}`);

        uploadedImages = [];
        renderPreviews();

      } catch (err) {
        logToConsole(`Error caught: ${err.message}`, 'err');

        let errorBubble = document.getElementById(aiMsgId).querySelector('.bubble');

        if (err.message === "RATE_LIMIT") {
          errorBubble.innerText = "⚠️ Rate limit reached, please try again later. It's not cause of your credit!";
        } else {
          errorBubble.innerText = `❌ Request failed (${err.message}). Your 💎 credits were NOT deducted.`;
        }
      }
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendToGist(code) {
      const token = document.getElementById('githubToken').value;
      const gistId = document.getElementById('gistId').value;

      logToConsole("Syncing Luau script to GitHub Gist...");

      const gistRes = await fetch(`https://api.github.com/gists/${gistId}`);
      const gistData = await gistRes.json();
      let currentCommands = JSON.parse(gistData.files["commands.json"].content || "[]");

      currentCommands.push(code);

      await fetch(`https://api.github.com/gists/${gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          files: { "commands.json": { content: JSON.stringify(currentCommands) } }
        })
      });
      logToConsole("Successfully updated Gist!");
    }
  </script>
</body>
</html>
