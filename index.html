<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio App</title>
  <style>
    body {
      background-color: #0f1015;
      color: #f3f4f6;
      font-family: monospace, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 15px;
      background: #181920;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2b36;
    }
    select {
      background: #22232e;
      color: #fff;
      border: 1px solid #3f4156;
      padding: 6px;
      border-radius: 5px;
      font-size: 0.85rem;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .user { background: #2563eb; align-self: flex-end; }
    .ai { background: #1f2937; align-self: flex-start; border: 1px solid #374151; }
    
    .chat-img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 6px;
      cursor: pointer;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.2);
    }

    #input-area {
      padding: 10px 15px;
      background: #181920;
      border-top: 1px solid #2a2b36;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      background: #111217;
      border: 1px solid #3f4156;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
    }
    button, .file-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .file-btn { background: #374151; font-size: 1.1rem; padding: 10px 12px; }
    
    #credit-bar {
      font-size: 0.85rem;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #image-preview-container {
      display: none;
      align-items: center;
      gap: 10px;
      background: #111217;
      padding: 5px 10px;
      border-radius: 6px;
      width: fit-content;
      border: 1px solid #3f4156;
    }
    #image-preview-container img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
    }
    .remove-img {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      cursor: pointer;
    }

    /* Fullscreen Modal for Images */
    #image-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      cursor: pointer;
    }
    #image-modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
    }

    /* Model color classes for money symbols */
    .tier-1 { color: #22c55e; } 
    .tier-2 { color: #f97316; } 
    .tier-3 { color: #eab308; } 
    .tier-4 { color: #ef4444; } 
    .tier-5 { color: #dc2626; font-weight: bold; } 
  </style>
</head>
<body>

  <!-- Fullscreen Image Modal Overlay -->
  <div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Fullscreen view">
  </div>

  <header>
    <div><strong>RoBuilder AI</strong></div>
    <div style="font-size: 0.85rem; color: #10b981;">● Online</div>
  </header>

  <div id="chat-container">
    <div class="message ai">yo bro, what's up?</div>
  </div>

  <div id="input-area">
    <div id="credit-bar">
      <span>Credits: <strong id="credit-count">1000</strong> 🪙</span>
      <!-- Model selector moved down here to the bottom bar -->
      <select id="model-select">
        <option value="gemini-3.1-flash-lite" class="tier-1">🟢 flash-lite ($)</option>
        <option value="gemini-2.5-flash" class="tier-2">🟠 2.5-flash ($$)</option>
        <option value="gemini-3.5-flash" class="tier-3">🟡 3.5-flash ($$$)</option>
        <option value="gemini-2.5-pro" class="tier-4">🟤 2.5-pro ($$$$)</option>
        <option value="gemini-3.1-pro-preview" class="tier-5">🔴 pro-preview ($$$$$)</option>
      </select>
    </div>

    <div id="image-preview-container">
      <img id="preview-thumb" src="" alt="preview">
      <span id="preview-name" style="font-size: 0.8rem; color:#aaa;">Image attached</span>
      <button class="remove-img" onclick="clearImage()">✕</button>
    </div>

    <div class="input-row">
      <label class="file-btn">
        📎 <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
      </label>
      <input type="text" id="prompt-input" placeholder="Type something..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let userCredits = 1000;
    let chatHistory = [];
    let currentBase64Image = null;
    let currentMimeType = null;

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      currentMimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Full = e.target.result;
        currentBase64Image = base64Full.split(',')[1];

        document.getElementById('preview-thumb').src = base64Full;
        document.getElementById('image-preview-container').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      currentBase64Image = null;
      currentMimeType = null;
      document.getElementById('image-input').value = '';
      document.getElementById('image-preview-container').style.display = 'none';
    }

    function openModal(imgSrc) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('image-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('image-modal').style.display = 'none';
    }

    async function sendMessage() {
      const input = document.getElementById('prompt-input');
      const container = document.getElementById('chat-container');
      const creditDisplay = document.getElementById('credit-count');
      const modelSelect = document.getElementById('model-select');
      
      const text = input.value.trim();
      if (!text && !currentBase64Image) return;

      if (userCredits <= 0) {
        alert("Out of credits! You broke, bradar 💀");
        return;
      }

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      
      let userContentHtml = '';
      if (currentBase64Image) {
        const fullDataUrl = `data:${currentMimeType};base64,${currentBase64Image}`;
        userContentHtml += `<img src="${fullDataUrl}" class="chat-img" onclick="openModal('${fullDataUrl}')">`;
      }
      if (text) {
        userContentHtml += `<span>${text}</span>`;
      }
      userMsg.innerHTML = userContentHtml;
      container.appendChild(userMsg);

      const attachedImgBase64 = currentBase64Image;
      const attachedMime = currentMimeType;

      input.value = '';
      clearImage();
      container.scrollTop = container.scrollHeight;

      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.innerText = 'thinking...';
      container.appendChild(aiMsg);
      container.scrollTop = container.scrollHeight;

      try {
        const userParts = [];
        if (attachedImgBase64) {
          userParts.push({
            inline_data: {
              mime_type: attachedMime,
              data: attachedImgBase64
            }
          });
        }
        if (text) {
          userParts.push({ text: text });
        }

        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text || "Analyze this image.",
            model: modelSelect.value,
            history: chatHistory,
            imagePart: attachedImgBase64 ? { mime_type: attachedMime, data: attachedImgBase64 } : null
          })
        });

        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "my bad, didn't catch that.";
        
        aiMsg.innerText = reply;
        
        const cost = Math.max(5, Math.floor(reply.length / 10));
        userCredits = Math.max(0, userCredits - cost);
        creditDisplay.innerText = userCredits;

        chatHistory.push({ role: 'user', parts: userParts });
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });

      } catch (err) {
        aiMsg.innerText = 'yikes, connection dropped.';
      }

      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('prompt-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
