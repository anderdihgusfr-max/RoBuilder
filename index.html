<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ro-builder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0c0d10;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Bar from original UI */
    header {
      padding: 12px 16px;
      background: #121318;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e2029;
    }
    .header-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-badge {
      background: #1e2029;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #fbbf24;
      border: 1px solid #2d3142;
    }

    /* Chat Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Message Wrapper with Avatar */
    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 85%;
    }
    .msg-row.ai-row {
      align-self: flex-start;
    }
    .msg-row.user-row {
      align-self: flex-end;
      justify-content: flex-end;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .message {
      padding: 12px 16px;
      border-radius: 14px;
      word-wrap: break-word;
      font-size: 0.95rem;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .user {
      background: #272a37;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .ai {
      background: #161821;
      color: #e2e8f0;
      border: 1px solid #232635;
      border-bottom-left-radius: 4px;
    }

    .chat-img {
      max-width: 220px;
      max-height: 220px;
      border-radius: 8px;
      cursor: pointer;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Original Bottom Input Card UI */
    #input-card {
      margin: 12px;
      background: #121318;
      border: 1px solid #1e2029;
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #image-preview-container {
      display: none;
      align-items: center;
      gap: 8px;
      background: #1a1c24;
      padding: 6px 10px;
      border-radius: 8px;
      width: fit-content;
      border: 1px solid #2a2d3d;
    }
    #image-preview-container img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
    }
    .remove-img {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
    }

    .input-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]::placeholder {
      color: #64748b;
    }

    .send-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Bottom Control Bar inside input card */
    .input-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1a1c24;
      padding-top: 8px;
    }

    .file-btn {
      background: #1a1c24;
      border: 1px solid #2a2d3d;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    select {
      background: #1a1c24;
      color: #cbd5e1;
      border: 1px solid #2a2d3d;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
    }

    /* Fullscreen Modal */
    #image-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      cursor: pointer;
    }
    #image-modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
    }

    .tier-1 { color: #22c55e; } 
    .tier-2 { color: #f97316; } 
    .tier-3 { color: #eab308; } 
    .tier-4 { color: #ef4444; } 
    .tier-5 { color: #dc2626; font-weight: bold; } 
  </style>
</head>
<body>

  <div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Fullscreen view">
  </div>

  <header>
    <div class="header-title">
      🤖 ro-builder
    </div>
    <div class="header-badge">
      ✨ Credits: <span id="credit-count">1000</span>
    </div>
  </header>

  <div id="chat-container">
    <div class="msg-row ai-row">
      <div class="avatar">🤖</div>
      <div class="message ai">Hey! How can I help you today?</div>
    </div>
  </div>

  <div id="input-card">
    <div id="image-preview-container">
      <img id="preview-thumb" src="" alt="preview">
      <span style="font-size: 0.8rem; color:#94a3b8;">Image attached</span>
      <button class="remove-img" onclick="clearImage()">✕</button>
    </div>

    <div class="input-main">
      <input type="text" id="prompt-input" placeholder="Ask Gemini anything..." autocomplete="off">
      <button class="send-btn" onclick="sendMessage()">➔</button>
    </div>

    <div class="input-bottom-bar">
      <label class="file-btn">
        📎 <span>Attach</span>
        <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
      </label>

      <select id="model-select">
        <option value="gemini-3.1-flash-lite" class="tier-1">🟢 flash-lite ($)</option>
        <option value="gemini-2.5-flash" class="tier-2" selected>🟠 2.5-flash ($$)</option>
        <option value="gemini-3.5-flash" class="tier-3">🟡 3.5-flash ($$$)</option>
        <option value="gemini-2.5-pro" class="tier-4">🟤 2.5-pro ($$$$)</option>
        <option value="gemini-3.1-pro-preview" class="tier-5">🔴 pro-preview ($$$$$)</option>
      </select>
    </div>
  </div>

  <script>
    let userCredits = 1000;
    let chatHistory = [];
    let currentBase64Image = null;
    let currentMimeType = null;

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      currentMimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Full = e.target.result;
        currentBase64Image = base64Full.split(',')[1];

        document.getElementById('preview-thumb').src = base64Full;
        document.getElementById('image-preview-container').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      currentBase64Image = null;
      currentMimeType = null;
      document.getElementById('image-input').value = '';
      document.getElementById('image-preview-container').style.display = 'none';
    }

    function openModal(imgSrc) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('image-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('image-modal').style.display = 'none';
    }

    async function sendMessage() {
      const input = document.getElementById('prompt-input');
      const container = document.getElementById('chat-container');
      const creditDisplay = document.getElementById('credit-count');
      const modelSelect = document.getElementById('model-select');
      
      const text = input.value.trim();
      if (!text && !currentBase64Image) return;

      if (userCredits <= 0) {
        alert("Out of credits, bradar!");
        return;
      }

      // Add User Row
      const userRow = document.createElement('div');
      userRow.className = 'msg-row user-row';
      
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      
      let userContentHtml = '';
      if (currentBase64Image) {
        const fullDataUrl = `data:${currentMimeType};base64,${currentBase64Image}`;
        userContentHtml += `<img src="${fullDataUrl}" class="chat-img" onclick="openModal('${fullDataUrl}')">`;
      }
      if (text) {
        userContentHtml += `<span>${text}</span>`;
      }
      userMsg.innerHTML = userContentHtml;
      userRow.appendChild(userMsg);
      container.appendChild(userRow);

      const attachedImgBase64 = currentBase64Image;
      const attachedMime = currentMimeType;

      input.value = '';
      clearImage();
      container.scrollTop = container.scrollHeight;

      // Add AI Loading Row with Avatar
      const aiRow = document.createElement('div');
      aiRow.className = 'msg-row ai-row';
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerText = '🤖';

      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.innerText = '...';
      
      aiRow.appendChild(avatar);
      aiRow.appendChild(aiMsg);
      container.appendChild(aiRow);
      container.scrollTop = container.scrollHeight;

      try {
        const userParts = [];
        if (attachedImgBase64) {
          userParts.push({
            inline_data: {
              mime_type: attachedMime,
              data: attachedImgBase64
            }
          });
        }
        if (text) {
          userParts.push({ text: text });
        }

        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text || "Analyze this image.",
            model: modelSelect.value,
            history: chatHistory,
            imagePart: attachedImgBase64 ? { mime_type: attachedMime, data: attachedImgBase64 } : null
          })
        });

        const data = await res.json();
        
        if (data.error) {
          aiMsg.innerText = "⚠️ Error: " + (data.error.message || data.error);
        } else {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";
          aiMsg.innerText = reply;
          
          const cost = Math.max(5, Math.floor(reply.length / 10));
          userCredits = Math.max(0, userCredits - cost);
          creditDisplay.innerText = userCredits;

          chatHistory.push({ role: 'user', parts: userParts });
          chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        }

      } catch (err) {
        aiMsg.innerText = '❌ Request failed. Make sure your serverless route is deployed!';
      }

      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('prompt-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
