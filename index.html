<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gemini AI</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'VT323', monospace; }
    
    html, body {
      background: #000000;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-size: 18px;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: env(safe-area-inset-top, 10px);
      padding-bottom: env(safe-area-inset-bottom, 10px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: #000000;
      border-bottom: 1px solid #222;
      z-index: 100;
      height: 60px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      padding: 5px;
    }

    .model-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .model-selector-btn {
      background: #111;
      color: #3b82f6;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-dropdown-menu {
      display: none;
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%);
      background: #161618;
      border: 1px solid #333;
      border-radius: 12px;
      width: 240px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      z-index: 500;
      flex-direction: column;
      gap: 4px;
    }

    .model-dropdown-menu.show {
      display: flex;
    }

    .dropdown-item {
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dropdown-item.selected {
      background: #222226;
      border: 1px solid #444;
    }

    .dropdown-divider {
      height: 1px;
      background: #333;
      margin: 4px 0;
    }

    .thinking-option {
      color: #888;
    }

    .thinking-option.active {
      color: #60a5fa;
      font-weight: bold;
    }

    .header-right { display: flex; gap: 10px; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 88%;
      word-wrap: break-word;
      display: flex;
      flex-direction: column;
      gap: 6px;
      line-height: 1.25;
    }
    
    .user { 
      background: #1c1c1e; 
      align-self: flex-end; 
      padding: 12px 16px; 
      border-radius: 18px; 
    }
    
    .ai { 
      align-self: flex-start; 
      background: transparent; 
      color: #e5e5e5;
    }
    
    .chat-img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 12px;
      cursor: pointer;
      object-fit: cover;
    }

    #input-area {
      padding: 10px 15px 15px 15px;
      background: #000000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid #111;
    }

    .input-pill {
      background: #1c1c1e;
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 10px;
      height: 50px;
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 18px;
      outline: none;
    }
    input[type="text"]::placeholder { color: #777; }

    .action-btn {
      background: transparent;
      color: #aaa;
      border: none;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #credit-bar {
      font-size: 14px;
      color: #666;
      display: flex;
      justify-content: center;
      text-align: center;
    }

    #image-preview-container {
      display: none;
      align-items: center;
      gap: 8px;
      background: #1c1c1e;
      padding: 4px 8px;
      border-radius: 12px;
      width: fit-content;
    }
    #image-preview-container img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
    }
    .remove-img {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      cursor: pointer;
    }

    #image-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      justify-content: center;
      align-items: center;
      z-index: 4000;
      cursor: pointer;
    }
    #image-modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Fullscreen view">
  </div>

  <header>
    <button class="icon-btn">＝</button>
    
    <div class="model-wrapper">
      <button class="model-selector-btn" onclick="toggleMenu(event)">
        <span id="selected-model-label">⚡ Gemini Flash (Lite)</span> ▼
      </button>

      <!-- Exact Order: 1. Flash Lite | 2. Flash | 3. Pro -->
      <div id="model-menu" class="model-dropdown-menu">
        <button id="opt-lite" class="dropdown-item selected" onclick="selectModel('gemini-2.5-flash-lite', '⚡ Gemini Flash (Lite)', 'opt-lite')">
          ⚡ Gemini Flash (Lite)
        </button>
        <button id="opt-flash" class="dropdown-item" onclick="selectModel('gemini-2.5-flash', '🟢 Gemini Flash', 'opt-flash')">
          🟢 Gemini Flash
        </button>
        <button id="opt-pro" class="dropdown-item" onclick="selectModel('gemini-2.5-pro', '🟡 Gemini Pro', 'opt-pro')">
          🟡 Gemini Pro
        </button>
        
        <div class="dropdown-divider"></div>

        <button id="menu-thinking-btn" class="dropdown-item thinking-option" onclick="toggleExtendedThinkingInMenu(event)">
          <span>🧠 Extended Thinking</span>
          <span id="thinking-status">OFF</span>
        </button>
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn">↻</button>
      <button class="icon-btn">⋮</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="message ai">Gemini +<br><br>hey bro! How can I help you today?</div>
  </div>

  <div id="input-area">
    <div id="image-preview-container">
      <img id="preview-thumb" src="" alt="preview">
      <button class="remove-img" onclick="clearImage()">✕</button>
    </div>
    
    <div class="input-pill">
      <label class="action-btn">
        ＋ <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
      </label>
      <input type="text" id="prompt-input" placeholder="Ask Gemini" autocomplete="off">
      <button class="action-btn" onclick="sendMessage()" style="border: 1px solid #444; border-radius: 8px; width: 30px; height: 30px; font-size: 14px;">⏏</button>
    </div>
    
    <div id="credit-bar">
      Credits: <strong id="credit-count" style="color:#4ade80; margin-left: 5px;">1000</strong> 🪙
    </div>
  </div>

  <script>
    let userCredits = 1000;
    let chatHistory = [];
    let currentBase64Image = null;
    let currentMimeType = null;
    let isExtendedThinking = false;
    
    // Default model setting
    let currentSelectedModel = 'gemini-2.5-flash-lite';

    const VERCEL_BACKEND_URL = `${window.location.origin}/api/generate`;

    function toggleMenu(e) {
      e.stopPropagation();
      document.getElementById('model-menu').classList.toggle('show');
    }

    function toggleExtendedThinkingInMenu(e) {
      e.stopPropagation();
      isExtendedThinking = !isExtendedThinking;
      
      const btn = document.getElementById('menu-thinking-btn');
      const status = document.getElementById('thinking-status');

      if (isExtendedThinking) {
        btn.classList.add('active');
        status.innerText = 'ON';
      } else {
        btn.classList.remove('active');
        status.innerText = 'OFF';
      }
    }

    // Dynamic selection fix that persists your choice permanently across menu opens
    function selectModel(modelVal, labelText, elementId) {
      currentSelectedModel = modelVal;
      document.getElementById('selected-model-label').innerText = labelText;
      
      document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('selected'));
      document.getElementById(elementId).classList.add('selected');
      
      document.getElementById('model-menu').classList.remove('show');
    }

    document.addEventListener('click', function(e) {
      const menu = document.getElementById('model-menu');
      if (menu.classList.contains('show')) {
        menu.classList.remove('show');
      }
    });

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      currentMimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Full = e.target.result;
        currentBase64Image = base64Full.split(',')[1];
        document.getElementById('preview-thumb').src = base64Full;
        document.getElementById('image-preview-container').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      currentBase64Image = null;
      currentMimeType = null;
      document.getElementById('image-input').value = '';
      document.getElementById('image-preview-container').style.display = 'none';
    }

    function openModal(imgSrc) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('image-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('image-modal').style.display = 'none';
    }

    async function sendMessage() {
      const input = document.getElementById('prompt-input');
      const container = document.getElementById('chat-container');
      const creditDisplay = document.getElementById('credit-count');
      
      const text = input.value.trim();
      if (!text && !currentBase64Image) return;

      if (userCredits <= 0) {
        alert("Out of credits! You broke, bradar 💀");
        return;
      }

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      
      let userContentHtml = '';
      if (currentBase64Image) {
        const fullDataUrl = `data:${currentMimeType};base64,${currentBase64Image}`;
        userContentHtml += `<img src="${fullDataUrl}" class="chat-img" onclick="openModal('${fullDataUrl}')">`;
      }
      if (text) {
        userContentHtml += `<span>${text}</span>`;
      }
      userMsg.innerHTML = userContentHtml;
      container.appendChild(userMsg);

      const attachedImgBase64 = currentBase64Image;
      const attachedMime = currentMimeType;

      input.value = '';
      clearImage();
      container.scrollTop = container.scrollHeight;

      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.innerHTML = isExtendedThinking ? 'Thinking deeply... 🧠' : 'Thinking...';
      container.appendChild(aiMsg);
      container.scrollTop = container.scrollHeight;

      try {
        const userParts = [];
        if (attachedImgBase64) {
          userParts.push({ inline_data: { mime_type: attachedMime, data: attachedImgBase64 } });
        }
        if (text) {
          userParts.push({ text: text });
        }

        const res = await fetch(VERCEL_BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text || "Analyze this image.",
            model: currentSelectedModel,
            history: chatHistory,
            extendedThinking: isExtendedThinking,
            imagePart: attachedImgBase64 ? { mime_type: attachedMime, data: attachedImgBase64 } : null
          })
        });

        const data = await res.json();
        
        if (data.error) {
          aiMsg.innerHTML = `Error: ${data.error.message || data.error}`;
          return;
        }

        let reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No output generated.";
        
        reply = reply.replace(/\n/g, '<br>');
        aiMsg.innerHTML = reply;
        
        const cost = Math.max(5, Math.floor(reply.length / 10));
        userCredits = Math.max(0, userCredits - cost);
        creditDisplay.innerText = userCredits;

        chatHistory.push({ role: 'user', parts: userParts });
        chatHistory.push({ role: 'model', parts: [{ text: reply.replace(/<br>/g, '\n') }] });

      } catch (err) {
        aiMsg.innerHTML = 'Request failed. Check Vercel backend!';
      }

      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('prompt-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
