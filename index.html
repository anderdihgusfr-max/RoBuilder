<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoBuilder AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #000000; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; overflow-x: hidden; }

    /* Top Config Bar (Collapsible / Hidden for Github Token & Gist ID) */
    .config-toggle { position: absolute; top: 12px; right: 12px; background: #181818; border: 1px solid #282828; color: #888; font-size: 11px; padding: 4px 10px; border-radius: 20px; cursor: pointer; z-index: 20; }
    .config-toggle:hover { color: #fff; border-color: #444; }

    .top-bar { position: absolute; top: 42px; left: 12px; right: 12px; max-width: 620px; margin: 0 auto; display: none; flex-direction: column; gap: 8px; background: #121212; border: 1px solid #282828; padding: 12px; border-radius: 12px; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .top-bar.active { display: flex; }
    .top-bar input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; outline: none; width: 100%; }
    .top-bar input:focus { border-color: #3b82f6; }

    /* Container Box */
    .builder-container { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 12px; position: relative; margin-top: 20px; }

    /* Mode Toggle Switch Header */
    .mode-toggle { display: inline-flex; align-items: center; background: #111111; border: 1px solid #222222; border-radius: 12px; padding: 6px 12px; width: fit-content; gap: 8px; font-size: 13px; color: #888; font-weight: 500; }
    .toggle-switch { position: relative; display: inline-block; width: 34px; height: 18px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 18px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #3b82f6; }
    input:checked + .slider:before { transform: translateX(16px); }

    /* Prompt Box */
    .prompt-box { background: #181818; border: 1px solid #2a2a2a; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .prompt-box textarea { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; resize: none; outline: none; height: 60px; font-weight: 400; }
    .prompt-box textarea::placeholder { color: #888888; }

    /* Image Preview Container */
    .image-preview-wrapper { display: none; position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid #3b82f6; }
    .image-preview-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .remove-img-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Bottom Toolbar */
    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .tool-btn { background: #222222; border: 1px solid #2a2a2a; color: #888; padding: 8px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .tool-btn:hover { background: #2a2a2a; color: #fff; }

    .badge-btn { background: #222222; border: 1px solid #2a2a2a; color: #ccc; padding: 8px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .badge-btn:hover { background: #2a2a2a; }

    .send-btn { background: #222222; border: 1px solid #2a2a2a; color: #888; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 16px; }
    .send-btn:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; }

    /* Floating Model Picker Dropdown */
    .model-menu { position: absolute; bottom: 60px; right: 12px; width: 280px; background: #121212; border: 1px solid #282828; border-radius: 16px; padding: 12px; display: none; flex-direction: column; gap: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.8); z-index: 100; }
    .model-menu.active { display: flex; }

    .model-card { background: #1a1a1a; border: 1px solid #262626; border-radius: 12px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: 0.2s; }
    .model-card:hover { border-color: #3b82f6; background: #222222; }
    .model-card.selected { border-color: #3b82f6; background: #1e293b; }

    .model-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; color: #ffffff; }
    .model-cost { font-size: 12px; color: #eab308; font-weight: bold; }

    .rating-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #888888; }
    .bars { display: flex; gap: 2px; }
    .bar { width: 12px; height: 4px; border-radius: 2px; background: #333; }
    .bar.active { background: #eab308; }

    .buy-credits-btn { width: 100%; background: #ffffff; color: #000000; border: none; padding: 8px; border-radius: 12px; font-weight: 600; font-size: 12px; cursor: pointer; margin-top: 4px; text-align: center; }
    
    #status { font-size: 12px; color: #22c55e; margin-top: 4px; word-break: break-word; }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .toolbar { justify-content: space-between; }
      .model-menu { right: 0; width: 100%; }
      .prompt-box textarea { font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- Hidden Settings Toggle -->
  <button class="config-toggle" onclick="toggleConfig()">⚙️ Studio Config</button>

  <!-- GitHub Credentials Bar -->
  <div class="top-bar" id="topConfigBar">
    <input type="password" id="githubToken" value="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" placeholder="GitHub Token (ghp_...)">
    <input type="text" id="gistId" value="210edf12f31701ce97b141e248fa090c" placeholder="Gist ID">
  </div>

  <div class="builder-container">
    <!-- Mode Toggle -->
    <div class="mode-toggle">
      <span>Agent</span>
      <label class="toggle-switch">
        <input type="checkbox" id="agentToggle" checked>
        <span class="slider"></span>
      </label>
      <span style="color:#ffffff;">Explore</span>
    </div>

    <!-- Main Input Box -->
    <div class="prompt-box">
      <!-- Attached Image Preview -->
      <div class="image-preview-wrapper" id="imgPreviewWrapper">
        <img id="imgPreview" src="" alt="Attached Image">
        <button class="remove-img-btn" onclick="removeImage()">✕</button>
      </div>

      <textarea id="promptInput" placeholder="Describe a mechanic or upload an image model..."></textarea>
      
      <div class="toolbar">
        <div class="toolbar-left">
          <!-- Image Upload Button -->
          <button class="tool-btn" onclick="document.getElementById('imageFileInput').click()">🖼️ Image</button>
          <input type="file" id="imageFileInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        </div>

        <div class="toolbar-right">
          <!-- Model Selector Trigger -->
          <button class="tool-btn" onclick="toggleModelMenu(event)" id="selectedModelLabel">
            🌐 Gemini 2.5 Flash ▾
          </button>

          <!-- Credits Display -->
          <button class="badge-btn" onclick="toggleModelMenu(event)">
            💾 <span id="creditCount">1.50</span>
          </button>

          <!-- Send Prompt Button -->
          <button class="send-btn" onclick="sendPrompt()">➔</button>
        </div>
      </div>

      <!-- Floating Model Selection Popup -->
      <div class="model-menu" id="modelMenu" onclick="event.stopPropagation()">
        
        <div class="model-card selected" onclick="selectModel('gemini-2.5-flash', 'Gemini 2.5 Flash', 0.10, this)">
          <div class="model-header">
            <span>🌐 Gemini 2.5 Flash</span>
            <span class="model-cost">$0.10</span>
          </div>
          <div class="rating-row">
            <span>Simple tasks</span>
            <div class="bars"><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div><div class="bar"></div><div class="bar"></div></div>
          </div>
          <div class="rating-row">
            <span>Complex tasks</span>
            <div class="bars"><div class="bar active"></div><div class="bar active"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
          </div>
        </div>

        <div class="model-card" onclick="selectModel('gemini-1.5-flash', 'Gemini 1.5 Flash', 0.25, this)">
          <div class="model-header">
            <span>⚡ Gemini 1.5 Flash</span>
            <span class="model-cost">$0.25</span>
          </div>
          <div class="rating-row">
            <span>Simple tasks</span>
            <div class="bars"><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div><div class="bar"></div></div>
          </div>
          <div class="rating-row">
            <span>Complex tasks</span>
            <div class="bars"><div class="bar active"></div><div class="bar active"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
          </div>
        </div>

        <div class="model-card" onclick="selectModel('gemini-1.5-pro', 'Gemini 1.5 Pro', 0.50, this)">
          <div class="model-header">
            <span>🧠 Gemini 1.5 Pro</span>
            <span class="model-cost">$0.50</span>
          </div>
          <div class="rating-row">
            <span>Simple tasks</span>
            <div class="bars"><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div></div>
          </div>
          <div class="rating-row">
            <span>Complex tasks</span>
            <div class="bars"><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div></div>
          </div>
        </div>

        <button class="buy-credits-btn" onclick="addCredits()">Add Free Credits</button>
      </div>

    </div>
    <div id="status"></div>
  </div>

  <script>
    let activeModel = 'gemini-2.5-flash';
    let currentCost = 0.10;
    let availableCredits = 1.50;
    let uploadedImageBase64 = null;

    function toggleConfig() {
      document.getElementById('topConfigBar').classList.toggle('active');
    }

    function toggleModelMenu(event) {
      event.stopPropagation();
      document.getElementById('modelMenu').classList.toggle('active');
    }

    document.addEventListener('click', () => {
      document.getElementById('modelMenu').classList.remove('active');
    });

    function selectModel(modelId, displayName, cost, element) {
      activeModel = modelId;
      currentCost = cost;
      document.getElementById('selectedModelLabel').innerText = `${displayName} ▾`;
      
      document.querySelectorAll('.model-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      document.getElementById('modelMenu').classList.remove('active');
    }

    function addCredits() {
      availableCredits += 1.00;
      document.getElementById('creditCount').innerText = availableCredits.toFixed(2);
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const fullBase64 = e.target.result;
        uploadedImageBase64 = fullBase64.split(',')[1];
        document.getElementById('imgPreview').src = fullBase64;
        document.getElementById('imgPreviewWrapper').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      uploadedImageBase64 = null;
      document.getElementById('imageFileInput').value = '';
      document.getElementById('imgPreviewWrapper').style.display = 'none';
    }

    async function sendPrompt() {
      const token = document.getElementById('githubToken').value;
      const gistId = document.getElementById('gistId').value;
      const prompt = document.getElementById('promptInput').value;
      const status = document.getElementById('status');

      if (!prompt && !uploadedImageBase64) {
        return alert("Please write a prompt or attach an image!");
      }

      if (availableCredits < currentCost) {
        return alert("Not enough credits! Click 'Add Free Credits' in the model menu.");
      }

      status.innerText = `Generating Luau code via Vercel (${activeModel})...`;

      try {
        availableCredits -= currentCost;
        document.getElementById('creditCount').innerText = availableCredits.toFixed(2);

        // 1. Send request to your Vercel Proxy (Replace with your actual Vercel URL)
        const vercelEndpoint = 'https://YOUR-VERCEL-URL.vercel.app/api/generate';
        
        const geminiRes = await fetch(vercelEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            activeModel: activeModel,
            uploadedImageBase64: uploadedImageBase64
          })
        });

        const gData = await geminiRes.json();
        
        if (gData.error) {
          throw new Error(gData.error);
        }

        let luauCode = gData.candidates[0].content.parts[0].text;
        luauCode = luauCode.replace(/```lua/g, '').replace(/```/g, '').trim();

        status.innerText = "Sending code to GitHub Gist...";

        // 2. Fetch Gist
        const gistRes = await fetch(`https://api.github.com/gists/${gistId}`);
        const gistData = await gistRes.json();
        let currentCommands = JSON.parse(gistData.files["commands.json"].content || "[]");

        currentCommands.push(luauCode);

        // 3. Save to Gist
        await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            files: { "commands.json": { content: JSON.stringify(currentCommands) } }
          })
        });

        status.innerText = "Success! Sent to Roblox Studio.";
        removeImage();
        document.getElementById('promptInput').value = '';
      } catch (err) {
        status.innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
