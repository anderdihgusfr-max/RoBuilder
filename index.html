<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ro-builder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: monospace, sans-serif;
    }
    body {
      background-color: #0b0c10;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 85%;
      word-wrap: break-word;
      font-size: 0.95rem;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .user {
      background: #2a2d37;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .ai {
      background: #15161c;
      color: #e0e0e0;
      align-self: flex-start;
      border: 1px solid #22242e;
      border-bottom-left-radius: 2px;
    }

    .chat-img {
      max-width: 220px;
      max-height: 220px;
      border-radius: 8px;
      cursor: pointer;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #input-area {
      padding: 12px;
      background: #111217;
      border-top: 1px solid #1f2129;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 0.85rem;
      color: #888;
    }

    select {
      background: #1a1b23;
      color: #ccc;
      border: 1px solid #2a2c38;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background: #16171e;
      border: 1px solid #2a2c38;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]::placeholder {
      color: #555;
    }

    button {
      background: #2b2e3a;
      color: #fff;
      border: 1px solid #3a3e4f;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:active {
      background: #3a3e4f;
    }

    .file-btn {
      background: #16171e;
      border: 1px solid #2a2c38;
      color: #aaa;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #image-preview-container {
      display: none;
      align-items: center;
      gap: 8px;
      background: #16171e;
      padding: 6px 10px;
      border-radius: 6px;
      width: fit-content;
      border: 1px solid #2a2c38;
    }
    #image-preview-container img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
    }
    .remove-img {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
    }

    /* Modal for popup image preview */
    #image-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      cursor: pointer;
    }
    #image-modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
    }

    .tier-1 { color: #22c55e; } 
    .tier-2 { color: #f97316; } 
    .tier-3 { color: #eab308; } 
    .tier-4 { color: #ef4444; } 
    .tier-5 { color: #dc2626; font-weight: bold; } 
  </style>
</head>
<body>

  <div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Fullscreen view">
  </div>

  <div id="chat-container">
    <div class="message ai">Hey! How can I help you today?</div>
  </div>

  <div id="input-area">
    <div id="image-preview-container">
      <img id="preview-thumb" src="" alt="preview">
      <span style="font-size: 0.8rem; color:#888;">Image attached</span>
      <button class="remove-img" onclick="clearImage()">✕</button>
    </div>

    <div class="input-row">
      <label class="file-btn">
        🖼️ <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
      </label>
      <input type="text" id="prompt-input" placeholder="Ask Gemini anything..." autocomplete="off">
      <button onclick="sendMessage()">➔</button>
    </div>

    <div id="controls-bar">
      <span>Credits: <strong id="credit-count" style="color:#fff;">1000</strong> 🪙</span>
      <select id="model-select">
        <option value="gemini-3.1-flash-lite" class="tier-1">🟢 flash-lite ($)</option>
        <option value="gemini-2.5-flash" class="tier-2" selected>🟠 2.5-flash ($$)</option>
        <option value="gemini-3.5-flash" class="tier-3">🟡 3.5-flash ($$$)</option>
        <option value="gemini-2.5-pro" class="tier-4">🟤 2.5-pro ($$$$)</option>
        <option value="gemini-3.1-pro-preview" class="tier-5">🔴 pro-preview ($$$$$)</option>
      </select>
    </div>
  </div>

  <script>
    let userCredits = 1000;
    let chatHistory = [];
    let currentBase64Image = null;
    let currentMimeType = null;

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      currentMimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Full = e.target.result;
        currentBase64Image = base64Full.split(',')[1];

        document.getElementById('preview-thumb').src = base64Full;
        document.getElementById('image-preview-container').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      currentBase64Image = null;
      currentMimeType = null;
      document.getElementById('image-input').value = '';
      document.getElementById('image-preview-container').style.display = 'none';
    }

    function openModal(imgSrc) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('image-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('image-modal').style.display = 'none';
    }

    async function sendMessage() {
      const input = document.getElementById('prompt-input');
      const container = document.getElementById('chat-container');
      const creditDisplay = document.getElementById('credit-count');
      const modelSelect = document.getElementById('model-select');
      
      const text = input.value.trim();
      if (!text && !currentBase64Image) return;

      if (userCredits <= 0) {
        alert("Out of credits!");
        return;
      }

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      
      let userContentHtml = '';
      if (currentBase64Image) {
        const fullDataUrl = `data:${currentMimeType};base64,${currentBase64Image}`;
        userContentHtml += `<img src="${fullDataUrl}" class="chat-img" onclick="openModal('${fullDataUrl}')">`;
      }
      if (text) {
        userContentHtml += `<span>${text}</span>`;
      }
      userMsg.innerHTML = userContentHtml;
      container.appendChild(userMsg);

      const attachedImgBase64 = currentBase64Image;
      const attachedMime = currentMimeType;

      input.value = '';
      clearImage();
      container.scrollTop = container.scrollHeight;

      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.innerText = '...';
      container.appendChild(aiMsg);
      container.scrollTop = container.scrollHeight;

      try {
        const userParts = [];
        if (attachedImgBase64) {
          userParts.push({
            inline_data: {
              mime_type: attachedMime,
              data: attachedImgBase64
            }
          });
        }
        if (text) {
          userParts.push({ text: text });
        }

        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text || "Analyze this image.",
            model: modelSelect.value,
            history: chatHistory,
            imagePart: attachedImgBase64 ? { mime_type: attachedMime, data: attachedImgBase64 } : null
          })
        });

        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Request failed.";
        
        aiMsg.innerText = reply;
        
        const cost = Math.max(5, Math.floor(reply.length / 10));
        userCredits = Math.max(0, userCredits - cost);
        creditDisplay.innerText = userCredits;

        chatHistory.push({ role: 'user', parts: userParts });
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });

      } catch (err) {
        aiMsg.innerText = 'Request failed (SERVER_ERROR).';
      }

      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('prompt-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
